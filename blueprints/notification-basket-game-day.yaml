# Version : 1.1.0
blueprint:
  name: Basket TV Notification jour de match
  description: >
    Envoie une notification si au moins un capteur Basket TV a un match
    dans les prochaines heures (24 h par défaut) à partir de l'heure d'exécution.
  domain: automation

  input:
    match_sensors:
      name: Capteurs de matchs Basket TV
      description: Uniquement les capteurs de l'intégration Basket TV (sensor.basket_tv_*)
      selector:
        entity:
          multiple: true
          filter:
            - integration: basket_tv
              domain: sensor

    notification_service:
      name: Service de notification
      description: Choisissez le service de notification à utiliser (ex. notify.mobile_app_...)
      selector:
        text:

    notify_time:
      name: Heure de vérification
      default: "08:00:00"
      selector:
        time:

    hours_ahead:
      name: Fenêtre de recherche (heures)
      description: Nombre d'heures à regarder à partir de l'heure d'exécution
      default: 24
      selector:
        number:
          min: 1
          max: 72
          mode: box

    title_template:
      name: Titre de la notification
      default: "🏀 Match à venir !"
      selector:
        text:

trigger:
  - platform: time
    at: !input notify_time

variables:
  input_sensors: !input match_sensors
  notify_svc: !input notification_service
  title_rendered: !input title_template
  hours_ahead: !input hours_ahead

  matches: >
    {% set ns = namespace(result=[]) %}
    {% set n = now().replace(tzinfo=none) %}
    {% set limit = n + timedelta(hours=hours_ahead | int(24)) %}
    {% for entity_id in input_sensors %}
      {% set d = state_attr(entity_id, 'date') %}
      {% set h = (state_attr(entity_id, 'heure') or '00:00') | string | replace('h', ':') %}
      {% set h = h ~ '00' if h.endswith(':') else h %}
      {% if d %}
        {% set dt = strptime(d ~ ' ' ~ h, '%d/%m/%Y %H:%M', none) %}
        {% if dt is not none and n <= dt <= limit %}
          {% set ns.result = ns.result + [{'e': entity_id, 'dt': dt.isoformat()}] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ (ns.result | sort(attribute='dt') | map(attribute='e') | list) }}

    message_rendered: |-
    {% set today = now().strftime('%d/%m/%Y') %}
    {% set ns = namespace(blocs=[]) %}
    {% for s in matches %}
      {% set d1 = state_attr(s, 'diffuseur1') %}
      {% set d2 = state_attr(s, 'diffuseur2') %}
      {% set chaines = [d1, d2] | select('!=', '') | select('!=', none) | list | join(' / ') %}
      {% set d = state_attr(s, 'date') %}
      {% set lignes = [
        '🏀 ' ~ state_attr(s, 'game'),
        '🕐 ' ~ ((d ~ ' ') if d != today else '') ~ state_attr(s, 'heure')
      ] %}
      {% if chaines %}
        {% set lignes = lignes + ['📺 ' ~ chaines] %}
      {% endif %}
      {% set ns.blocs = ns.blocs + [lignes | join('\n')] %}
    {% endfor %}
    {{ ns.blocs | join('\n\n') }}

condition:
  - condition: template
    value_template: "{{ matches | length > 0 }}"

action:
  - action: "{{ notify_svc }}"
    data:
      title: "{{ title_rendered }}"
      message: "{{ message_rendered }}"

mode: single
