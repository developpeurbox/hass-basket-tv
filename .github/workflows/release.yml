name: Release

# Se déclenche uniquement quand manifest.json change sur main (donc quand tu
# bumps la version). Bouton "Run workflow" dispo aussi pour forcer à la main.
on:
  push:
    branches: [main]
    paths:
      - "custom_components/basket_tv/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour que git connaisse les tags existants

      - name: Lire la version dans manifest.json
        id: version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/basket_tv/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que le tag n'existe pas déjà
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer les notes (description du commit)
        if: steps.check.outputs.exists == 'false'
        run: |
          # Description étendue du dernier commit (sans la ligne de titre)
          git log -1 --pretty=format:'%b' > RELEASE_NOTES.md
          # Si la description est vide, on met un texte par défaut
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Version ${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          fi

      - name: Créer le tag + la release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
